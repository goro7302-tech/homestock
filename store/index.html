<!DOCTYPE html>
<html lang="en">
<head>
<title>Dashi Press — Practical guides on Japan</title>
<meta name="description" content="In-depth, practical English guides on living, working and doing business in Japan. Instant digital download.">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="store.css">
<script src="config.js"></script>
<script src="store.js"></script>
</head>
<body>
<header class="site"><div class="wrap">
  <a class="logo" href="./" data-brand>Dashi Press</a>
  <nav class="site"><a href="./">Guides</a><a href="legal.html">Terms &amp; refunds</a></nav>
</div></header>
<main class="wrap">
  <section class="hero">
    <h1>Japan, explained — practically.</h1>
    <p data-tagline>Practical guides on Japan, written for the rest of the world.</p>
  </section>
  <div class="filters" id="filters" role="group" aria-label="Filter by category"></div>
  <div class="grid" id="grid"><p class="empty">Loading guides…</p></div>
</main>
<footer class="site"><div class="wrap">
  <span>&copy; <span data-year></span> <span data-brand-plain>Dashi Press</span> · Guides are drafted with AI assistance.</span>
  <span><a href="legal.html">Terms, refunds &amp; legal notice</a><span data-contact></span></span>
</div></footer>
<script>
(async () => {
  const { esc, price, coverStyle, loadArticles } = Store;
  const grid = document.getElementById("grid");
  const filters = document.getElementById("filters");
  let articles = [];
  try { articles = await loadArticles(); }
  catch { grid.innerHTML = '<p class="empty">The catalog could not be loaded. Please refresh.</p>'; return; }

  const cats = ["All", ...new Set(articles.map((a) => a.category))];
  let active = new URLSearchParams(location.search).get("c") || "All";

  const render = () => {
    filters.innerHTML = cats.map((c) =>
      `<button type="button" aria-pressed="${c === active}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
    const list = active === "All" ? articles : articles.filter((a) => a.category === active);
    grid.innerHTML = list.length ? list.map((a) => `
      <a class="card" href="article.html?slug=${encodeURIComponent(a.slug)}">
        <div class="cover" style="${coverStyle(a)}" aria-hidden="true">${esc(a.cover?.emoji || "📘")}</div>
        <div class="body">
          <span class="chip">${esc(a.category)}</span>
          <h2>${esc(a.title)}</h2>
          <p>${esc(a.subtitle)}</p>
          <div class="meta"><span>${Number(a.readingMinutes) || "?"} min read</span><span class="price">${price(a.priceUsd)}</span></div>
        </div>
      </a>`).join("") : '<p class="empty">No guides in this category yet.</p>';
  };
  filters.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    active = b.dataset.c; render();
  });
  render();
})();
</script>
</body>
</html>
